name: Formal P vs NP complexity-class bridge
on:
  push:
    paths:
      - 'PvsNP_FormalClasses.lean'
      - 'lakefile.toml'
      - 'lean-toolchain'
  pull_request:
    paths:
      - 'PvsNP_FormalClasses.lean'
      - 'lakefile.toml'
      - 'lean-toolchain'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formal-complexity-classes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean and Lake
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Get actual NP-completeness definitions
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake build NPComplete
      - name: Prove P = NP iff SAT in P in TM0 complexity classes
        run: lake env lean PvsNP_FormalClasses.lean

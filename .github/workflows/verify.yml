name: Formal verification (Lean and Rust)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --all-targets
      - name: Rust experiments
        run: cargo run --release --manifest-path rust/Cargo.toml
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean and Lake via elan
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve Mathlib dependencies and install cache
        run: |
          set -euo pipefail
          lean --version
          lake update
          lake exe cache get
      - name: Reject unproved placeholders
        run: |
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit|axiom|native_decide)([^[:alnum:]_]|$)' PvsNP*.lean; then
            echo 'Incomplete or unchecked proof primitive detected'
            exit 1
          fi
      - name: Elaborate and kernel-check all proof files
        run: |
          set -euo pipefail
          for f in PvsNP.lean PvsNP_BlackBox.lean PvsNP_Counting.lean PvsNP_ExplicitCircuit.lean PvsNP_TwoCNF_Expressivity.lean PvsNP_MajorityClosure.lean PvsNP_Projected2CNF.lean; do
            echo "::group::$f"
            lake env lean "$f"
            echo "::endgroup::"
          done
